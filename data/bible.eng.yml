    columns:
    - name: id
      type: TEXT
      description: Primary identifier or slug.
    - name: translationId
      type: TEXT
      description: Foreign identifier matching Translation.id (e.g., 'BSB', 'ENGWEBP').
    - name: name
      type: TEXT
      description: Standard name or title.
    - name: commonName
      type: TEXT
      description: Common English name.
    - name: title
      type: TEXT
      description: Title heading.
    - name: order
      type: INT
      description: Canonical integer order index (1-based).
    - name: numberOfChapters
      type: INT
      description: Total number of chapters in this book.
    - name: sha256
      type: TEXT
      description: SHA-256 cryptographic checksum of data payload.
    - name: isApocryphal
      type: NUM
      description: Numeric boolean flag (1 if apocryphal / deuterocanonical, 0 otherwise).
